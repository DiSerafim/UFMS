    <h1>Introdução às Frações</h1>
    <h3>Idéia de fração</h3>
    <p>
        Numeros: <br>
        Contar e Medir<br>
    </p>

    <h3>Fração:</h3>
    <p>
        ┌──> Numerador (parte)<br>
        a/b <br>
        &nbsp; └─> Denominador (todo)
    </p>

    <h4>Exemplo:</h4>
    <p>
        🔳🔳🔳🔲🔲 => 3/5 <br>
        🔳🔲🔲🔲🔲 => 1/5 <br>
        🔳🔳🔳🔲 => 3/4 <br>
        🔳🔳🔲🔲 => 2/4
    </p>
